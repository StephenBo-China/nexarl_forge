name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Run test suite
        run: python -m unittest discover -s tests -q
      - name: Verify release
        run: python scripts/verify_release.py
  linux-first-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Test Linux source-mode first-run configuration
        run: python -m unittest discover -s tests -p 'test_vibe_memory_linux.py' -v
