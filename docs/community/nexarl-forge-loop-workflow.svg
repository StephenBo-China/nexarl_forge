<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Nexarl Forge 项目 Loop 开发闭环</title>
  <desc id="desc">用户与 Codex 协作设计和实现，Claude Code 独立评测，失败则回到实现阶段持续循环，验证通过后经用户批准发布。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091321"/><stop offset="1" stop-color="#142943"/></linearGradient>
    <linearGradient id="codex" x1="0" x2="1"><stop stop-color="#3278ff"/><stop offset="1" stop-color="#5f9dff"/></linearGradient>
    <linearGradient id="claude" x1="0" x2="1"><stop stop-color="#c777ff"/><stop offset="1" stop-color="#f08cba"/></linearGradient>
    <linearGradient id="loop" x1="0" x2="1"><stop stop-color="#16c6ad"/><stop offset="1" stop-color="#63e6be"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#72e6d2"/></marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e6a2d0"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:42px;font-weight:750;fill:#f7fbff}.sub{font-size:20px;fill:#b8c8dc}
      .h{font-size:25px;font-weight:700;fill:#fff}.body{font-size:17px;fill:#d0dced}.small{font-size:15px;fill:#aec0d8}
      .step{font-size:17px;font-weight:650;fill:#f5fbff}.chip{font-size:14px;font-weight:650;fill:#dffefa}
    </style>
  </defs>
  <rect width="1600" height="1000" rx="34" fill="url(#bg)"/>
  <text x="72" y="72" class="sans title">Nexarl Forge · Project Loop</text>
  <text x="72" y="108" class="sans sub">从目标、设计到独立评测与发布：Codex 和 Claude Code 在同一治理闭环中协作</text>

  <rect x="72" y="145" width="280" height="250" rx="24" fill="#17263d" stroke="#355170" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="122" cy="202" r="27" fill="#253a5b"/><text x="122" y="211" text-anchor="middle" class="sans h" fill="#bcd5ff">人</text>
  <text x="162" y="209" class="sans h">用户</text>
  <text x="100" y="252" class="sans body">提出目标与约束</text><text x="100" y="282" class="sans body">确认设计与验收标准</text><text x="100" y="312" class="sans body">批准 release / deploy</text><text x="100" y="342" class="sans body">查看记忆审核与报告</text>

  <rect x="398" y="145" width="420" height="250" rx="24" fill="#132e58" stroke="#4f8cff" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="448" cy="202" r="27" fill="#285da8"/><text x="448" y="211" text-anchor="middle" class="sans h" fill="#e7f0ff">C</text>
  <text x="488" y="209" class="sans h">Codex · 交互与实现</text>
  <text x="426" y="250" class="sans body">澄清 → brainstorming → writing-plans</text><text x="426" y="280" class="sans body">UI Design：偏好 / UI Skills / 设计审批</text><text x="426" y="310" class="sans body">创建隔离 worktree，TDD 实现与测试</text><text x="426" y="340" class="sans body">提交记忆候选，不绕过审批写入长期记忆</text>
  <rect x="426" y="357" width="120" height="25" rx="12" fill="#235fae"/><text x="486" y="375" text-anchor="middle" class="sans chip">Codex hooks</text>
  <rect x="556" y="357" width="120" height="25" rx="12" fill="#235fae"/><text x="616" y="375" text-anchor="middle" class="sans chip">UI gate</text>
  <rect x="686" y="357" width="108" height="25" rx="12" fill="#235fae"/><text x="740" y="375" text-anchor="middle" class="sans chip">TDD</text>

  <rect x="865" y="145" width="360" height="250" rx="24" fill="#38213e" stroke="#d18bdb" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="915" cy="202" r="27" fill="#704779"/><text x="915" y="211" text-anchor="middle" class="sans h" fill="#ffe9fb">Cl</text>
  <text x="955" y="209" class="sans h">Claude Code · 独立评测</text>
  <text x="893" y="250" class="sans body">读取 Loop 交付物与验收标准</text><text x="893" y="280" class="sans body">运行测试、审查实现与 UI 结果</text><text x="893" y="310" class="sans body">输出 claude_eval 报告</text><text x="893" y="340" class="sans body">只反馈问题，不直接替 Codex 改产品</text>
  <rect x="893" y="357" width="148" height="25" rx="12" fill="#714b7e"/><text x="967" y="375" text-anchor="middle" class="sans chip">Claude hooks</text>
  <rect x="1051" y="357" width="148" height="25" rx="12" fill="#714b7e"/><text x="1125" y="375" text-anchor="middle" class="sans chip">独立 evaluator</text>

  <rect x="1270" y="145" width="255" height="250" rx="24" fill="#123c3b" stroke="#4bd8c1" stroke-width="2" filter="url(#shadow)"/>
  <text x="1298" y="205" class="sans h">共享治理层</text><text x="1298" y="246" class="sans body">Loop 状态与锁</text><text x="1298" y="276" class="sans body">项目 / 个人记忆</text><text x="1298" y="306" class="sans body">审批、审计、回滚</text><text x="1298" y="336" class="sans body">上下文路由</text>

  <path d="M352 270H390" stroke="#72e6d2" stroke-width="3" marker-end="url(#arrow)"/><path d="M818 270H857" stroke="#72e6d2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1225 270H1262" stroke="#72e6d2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="380" y="246" class="sans small" text-anchor="middle">目标</text><text x="838" y="246" class="sans small" text-anchor="middle">交付</text><text x="1244" y="246" class="sans small" text-anchor="middle">状态</text>

  <rect x="72" y="445" width="1453" height="470" rx="28" fill="#101f34" stroke="#29435f" stroke-width="2"/>
  <text x="104" y="493" class="sans h">完整 Loop 使用路径</text>
  <text x="104" y="523" class="sans small">Loop 负责生命周期与发布边界；Superpowers 提供每一阶段的工程方法。</text>

  <g class="sans">
    <rect x="104" y="560" width="250" height="92" rx="18" fill="#1c3651"/><circle cx="133" cy="594" r="18" fill="#3278ff"/><text x="133" y="601" text-anchor="middle" class="step">1</text><text x="166" y="592" class="step">start</text><text x="166" y="620" class="small">拉取主分支，创建隔离 worktree</text>
    <rect x="386" y="560" width="250" height="92" rx="18" fill="#1c3651"/><circle cx="415" cy="594" r="18" fill="#3278ff"/><text x="415" y="601" text-anchor="middle" class="step">2</text><text x="448" y="592" class="step">设计与计划</text><text x="448" y="620" class="small">brainstorming · plan · UI 审批</text>
    <rect x="668" y="560" width="250" height="92" rx="18" fill="#1c3651"/><circle cx="697" cy="594" r="18" fill="#3278ff"/><text x="697" y="601" text-anchor="middle" class="step">3</text><text x="730" y="592" class="step">developing</text><text x="730" y="620" class="small">TDD、实现、调试、内部 review</text>
    <rect x="950" y="560" width="250" height="92" rx="18" fill="#3a2442"/><circle cx="979" cy="594" r="18" fill="#c777ff"/><text x="979" y="601" text-anchor="middle" class="step">4</text><text x="1012" y="592" class="step">Claude 评测</text><text x="1012" y="620" class="small">独立测试与 claude_eval 报告</text>
    <rect x="1232" y="560" width="250" height="92" rx="18" fill="#173e3b"/><circle cx="1261" cy="594" r="18" fill="#16c6ad"/><text x="1261" y="601" text-anchor="middle" class="step">5</text><text x="1294" y="592" class="step">verify</text><text x="1294" y="620" class="small">完成标准、祖先关系、部署提交</text>

    <rect x="104" y="710" width="420" height="108" rx="18" fill="#1a2f48"/><text x="132" y="748" class="step">失败 / 发现问题</text><text x="132" y="778" class="small">Claude 报告 → Codex 修复 → 再次 developing</text><text x="132" y="802" class="small">循环直到验收与验证通过</text>
    <rect x="558" y="710" width="420" height="108" rx="18" fill="#173e3b"/><text x="586" y="748" class="step">finish → 用户确认</text><text x="586" y="778" class="small">记录 feature commit，等待显式 release 批准</text><text x="586" y="802" class="small">不自动合并主分支、不自动发布</text>
    <rect x="1012" y="710" width="470" height="108" rx="18" fill="#173e3b"/><text x="1040" y="748" class="step">release → sync-canonical → deploy</text><text x="1040" y="778" class="small">锁定主分支，验证后快进推送与部署</text><text x="1040" y="802" class="small">verify 成功后 cleanup，保留可审计报告</text>
  </g>
  <path d="M918 606H940" stroke="#e6a2d0" stroke-width="3" marker-end="url(#arrowPink)"/><path d="M1230 606H1210" stroke="#72e6d2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1070 710 C1050 680 850 680 780 655" fill="none" stroke="#e6a2d0" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowPink)"/>
  <path d="M520 765H548" stroke="#72e6d2" stroke-width="3" marker-end="url(#arrow)"/><path d="M980 765H1002" stroke="#72e6d2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="800" y="960" text-anchor="middle" class="sans small">Nexarl Forge 不替代 Codex 或 Claude Code；它提供可持续、可审计、可回滚的协作闭环。</text>
</svg>
