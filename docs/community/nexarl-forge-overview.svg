<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nexarl Forge 与 Codex、Claude Code 的关系和使用方式</title>
  <desc id="desc">Codex 和 Claude Code 通过共享的 Nexarl Forge 控制层获得记忆、Loop、Hooks、项目治理和 UI Skills 能力。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111d33"/></linearGradient>
    <linearGradient id="forge" x1="0" x2="1"><stop stop-color="#2f7cff"/><stop offset="1" stop-color="#18c8b5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6ee7d7"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:42px;font-weight:700;fill:#f7fbff}.sub{font-size:20px;fill:#b8c7dc}.h{font-size:25px;font-weight:700;fill:#f7fbff}.body{font-size:18px;fill:#c7d4e8}.small{font-size:16px;fill:#a9bad2}.pill{font-size:17px;font-weight:600;fill:#dffefa}
    </style>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <text x="80" y="78" class="sans title">Nexarl Forge</text>
  <text x="80" y="113" class="sans sub">AI Coding 的本地协作控制层｜让 Codex 与 Claude Code 共享同一套上下文和治理</text>

  <rect x="80" y="160" width="300" height="220" rx="24" fill="#17243a" stroke="#314562" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="135" cy="220" r="28" fill="#202f49"/><text x="135" y="229" text-anchor="middle" class="sans h" fill="#8ab4ff">C</text>
  <text x="180" y="226" class="sans h">Codex</text>
  <text x="112" y="278" class="sans body">负责：对话、推理、写代码</text>
  <text x="112" y="315" class="sans small">使用共享 hooks 读取上下文</text>
  <text x="112" y="343" class="sans small">提交记忆候选，不直接改写长期记忆</text>

  <rect x="80" y="430" width="300" height="220" rx="24" fill="#17243a" stroke="#314562" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="135" cy="490" r="28" fill="#202f49"/><text x="135" y="499" text-anchor="middle" class="sans h" fill="#ffb178">A</text>
  <text x="180" y="496" class="sans h">Claude Code</text>
  <text x="112" y="548" class="sans body">负责：对话、推理、写代码</text>
  <text x="112" y="585" class="sans small">与 Codex 使用同一套 hooks</text>
  <text x="112" y="613" class="sans small">共享项目注册、策略和审核状态</text>

  <line x1="385" y1="270" x2="585" y2="390" stroke="#6ee7d7" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="385" y1="540" x2="585" y2="450" stroke="#6ee7d7" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="585" y="205" width="430" height="390" rx="30" fill="url(#forge)" filter="url(#shadow)"/>
  <text x="800" y="285" text-anchor="middle" class="sans title" font-size="36">Nexarl Forge</text>
  <text x="800" y="322" text-anchor="middle" class="sans pill">共享控制层（本地优先、审批驱动）</text>
  <line x1="640" y1="350" x2="960" y2="350" stroke="#d9fffa" stroke-opacity=".35"/>
  <text x="650" y="392" class="sans body">• Universal Hooks：统一接入 Codex / Claude Code</text>
  <text x="650" y="430" class="sans body">• 个人与项目长短期记忆 + 候选审核</text>
  <text x="650" y="468" class="sans body">• Loop 工程流程与项目上下文路由</text>
  <text x="650" y="506" class="sans body">• 设计偏好、UI 设计审批、UI Skills</text>
  <text x="650" y="544" class="sans body">• 回滚、迁移、审计和安全边界</text>

  <line x1="1018" y1="400" x2="1130" y2="400" stroke="#6ee7d7" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1130" y="160" width="390" height="490" rx="24" fill="#17243a" stroke="#314562" stroke-width="2" filter="url(#shadow)"/>
  <text x="1170" y="218" class="sans h">你得到的能力</text>
  <text x="1170" y="270" class="sans body">◉ 上下文：个人 / 项目记忆</text>
  <text x="1170" y="312" class="sans body">◉ 治理：审批后才生效</text>
  <text x="1170" y="354" class="sans body">◉ 协作：Codex / Claude Code 共用</text>
  <text x="1170" y="396" class="sans body">◉ 交付：Loop、项目和回滚</text>
  <text x="1170" y="438" class="sans body">◉ 设计：偏好、UI 审批、Skills</text>
  <text x="1170" y="480" class="sans body">◉ 安全：本机服务、敏感信息排除</text>
  <rect x="1170" y="535" width="300" height="70" rx="16" fill="#213551"/>
  <text x="1320" y="565" text-anchor="middle" class="sans small">Nexarl Forge 不替代模型</text>
  <text x="1320" y="589" text-anchor="middle" class="sans small">它让模型协作可持续、可审计</text>

  <text x="80" y="716" class="sans h">典型使用路径</text>
  <g class="sans">
    <rect x="80" y="750" width="270" height="90" rx="18" fill="#1b2c47"/><circle cx="120" cy="795" r="22" fill="#2f7cff"/><text x="120" y="803" text-anchor="middle" class="pill">1</text><text x="160" y="790" class="body">安装</text><text x="160" y="817" class="small">./install.sh</text>
    <rect x="380" y="750" width="270" height="90" rx="18" fill="#1b2c47"/><circle cx="420" cy="795" r="22" fill="#2f7cff"/><text x="420" y="803" text-anchor="middle" class="pill">2</text><text x="460" y="790" class="body">注册项目</text><text x="460" y="817" class="small">project register / init</text>
    <rect x="680" y="750" width="270" height="90" rx="18" fill="#1b2c47"/><circle cx="720" cy="795" r="22" fill="#2f7cff"/><text x="720" y="803" text-anchor="middle" class="pill">3</text><text x="760" y="790" class="body">开始编码</text><text x="760" y="817" class="small">Codex 或 Claude Code</text>
    <rect x="980" y="750" width="270" height="90" rx="18" fill="#1b2c47"/><circle cx="1020" cy="795" r="22" fill="#2f7cff"/><text x="1020" y="803" text-anchor="middle" class="pill">4</text><text x="1060" y="790" class="body">审核记忆</text><text x="1060" y="817" class="small">review → approve / reject</text>
    <rect x="1280" y="750" width="240" height="90" rx="18" fill="#1b2c47"/><circle cx="1320" cy="795" r="22" fill="#18c8b5"/><text x="1320" y="803" text-anchor="middle" class="pill">5</text><text x="1360" y="790" class="body">持续复用</text><text x="1360" y="817" class="small">Loop + context</text>
  </g>
</svg>
